version: 2

updates:
  # GitHub Actions — the highest-value ecosystem here. Actions are pinned by major
  # tag (actions/checkout@v4), so a compromised or abandoned action is a real
  # supply-chain risk and these updates are few and easy to review.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build(actions)"

  # Python. Runtime dependencies are declared as `>=` ranges rather than pins, so
  # these are mostly floor bumps — grouped and monthly to keep the noise down.
  # Security fixes arrive separately via Dependabot alerts and are not affected
  # by this cadence.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"

  # Frontend lint tooling only (eslint, htmlhint) — devDependencies, no shipped
  # runtime code, so monthly and grouped is plenty.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-lint:
        patterns: ["*"]
    commit-message:
      prefix: "build(npm)"

  # Front-end libraries vendored into modules/web_viewer/static/ — runtime code
  # every viewer page loads, so security fixes matter here. Those arrive through
  # Dependabot alerts as soon as an advisory is published; this schedule only
  # covers ordinary releases. Majors come one per PR, since they can change how
  # pages look. vendor-refresh.yml adds the regenerated files to each PR.
  - package-ecosystem: npm
    directory: "/scripts/web-vendor"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-vendor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(vendor)"
